services:
  # Backend Web Service
  - type: web
    name: fullstackocean-api
    runtime: node
    plan: free
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        fromDatabase: fullstackocean-mongodb
      - key: JWT_SECRET
        value: fullstackocean_supersecret_jwt_key_2026
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: CORS_ORIGIN
        value: https://fullstackocean-frontend.onrender.com

  # Frontend Static Site
  - type: static
    name: fullstackocean-frontend
    rootDir: frontend
    buildCommand: npm install && CI=false npm run build
    publishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://fullstackocean-api.onrender.com/api
