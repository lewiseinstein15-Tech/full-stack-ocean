version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fullstackocean-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/fullstackocean
      - JWT_SECRET=supersecretjwtkey12345
      - JWT_EXPIRES_IN=7d
      - BCRYPT_ROUNDS=12
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
    networks:
      - fullstackocean

  mongo:
    image: mongo:7
    container_name: fullstackocean-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: fullstackocean
    networks:
      - fullstackocean

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - REACT_APP_API_URL=http://localhost:5000/api
    container_name: fullstackocean-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - fullstackocean
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  fullstackocean:
    driver: bridge

# Quick Start:
# 1. docker-compose up --build -d
# 2. docker-compose exec backend node seeds/seed.js
# 3. Open http://localhost:3000